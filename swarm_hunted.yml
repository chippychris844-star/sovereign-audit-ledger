name: Sovereign Researcher Swarm
on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Swarm Hunter
        run: python logic/sovereign_swarm.py

      - name: Update Visualizer
        run: python logic/generate_graph_viz.py

      - name: Commit Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Sovereign-Swarm"
          git add extracts/*.json graph.mermaid README.md
          git commit -m "Swarm Harvest: $(date -u)" || exit 0
          git push
