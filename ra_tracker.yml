name: Sovereign Extinction Tracker
on:
  schedule:
    - cron: '0 0,12 * * *' # Every 12 hours (Midnight and Noon UTC)
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Weekly Extinction Capture
        run: python logic/ra_weekly_extinction.py

      - name: Commit Extinction Signals
        env:
          GH_TOKEN: ${{ secrets.RA_SOVEREIGN_PAT }}
        run: |
          git config --global user.name "Sovereign-Swarm-Node"
          git config --global user.email "ra-node@resolutionassurance.com.au"
          git add extracts/extinction_*.json
          git commit -m "Record Weekly Extinction Baselines [Cryosphere/Orbital/Biological]" || echo "No new signals"
          git push origin main
