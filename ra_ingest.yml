name: RA Sovereign Signal Ingestion
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.RA_SOVEREIGN_PAT }}

      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any needed dependencies here

      - name: Run Ingester (Cloud Mode)
        run: |
          # Since GitHub Actions don't have local N100 access, 
          # this runs the logic against public APIs/Space data.
          python logic/ra_raw_ingester.py --cloud-mode

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Sovereign Heartbeat: Cloud Ingestion $(date -u)" || exit 0
          git push
